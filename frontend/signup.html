<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-nav">
        <a class="brand" href="./index.html">
          <span class="app-name">To Do App</span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="./index.html">Home</a>
          <a href="./pricing.html">Pricing</a>
          <a href="./contact.html">Contact</a>
          <a href="./login.html">Log in</a>
        </nav>
      </div>
    </header>

    <main class="auth-shell">
      <section class="auth-card">
        <h1>Start using <span class="app-name">To Do App</span></h1>
        <p class="muted">Create an account to manage your tasks</p>

        <div id="authMessage" class="message" aria-live="polite" hidden></div>

        <form id="signupForm" class="form-stack" novalidate>
          <div class="form-field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required />
          </div>
          <button id="signupButton" type="submit">Create account</button>
        </form>

        <p class="muted"><a href="login.html">Already have an account?</a></p>
      </section>
    </main>
<script src = "./js/config.js"></script>
<script src="./js/ui-helpers.js"></script>
<script src="./js/auth.js"></script>
  </body>
</html>
