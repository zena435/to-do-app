<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in</title>
    <link rel="stylesheet" href="/CSS/styles.css"/>
  </head>
  <body>
    <header class="site-header">
      <div class="site-nav">
        <a class="brand" href="./index.html">
          <span class="app-name">To Do App</span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="./index.html">Home</a>
          <a href="./pricing.html">Pricing</a>
          <a href="./contact.html">Contact</a>
          <a href="./signup.html">Sign up</a>
        </nav>
      </div>
    </header>

    <main class="auth-shell">
      <section class="auth-card">
        <h1>Welcome back</h1>
        <p class="muted">Log in to see your tasks and pick up where you left off.</p>

        <div id="authMessage" class="message" aria-live="polite" hidden></div>

        <form id="loginForm" class="form-stack" novalidate>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button id="loginButton" type="submit">Log in</button>
        </form>

        <p class="muted"><a href="signup.html">Need an account?</a></p>
      </section>
    </main>
<script src = "./js/config.js"></script>
<script src="./js/ui-helpers.js"></script>
<script src="./js/auth.js"></script>
  </body>
</html>
